name: integration

# Runs on the branch the event fires for (push / workflow_dispatch read the
# branch's OWN version of this file), so no need to merge into main first.
on:
  push:
    branches: ["feat/android-chrome-raw-cdp"]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Also run the live Android-Chrome E2E (needs a self-hosted runner reachable to the phone's CDP)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mock-e2e:
    name: mock E2E (scripted CDP)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install websockets
        run: python -m pip install --upgrade pip websockets
      - name: Smoke parse of the raw CDP backend
        run: python -c "import ast; ast.parse(open('tools/browser_raw_cdp.py').read()); print('parse ok')"
      - name: Run deterministic mock E2E
        run: python tools/tests/test_browser_raw_cdp_mock.py 2>&1 | tail -5

  live-e2e:
    name: live E2E (Android Chrome via CDP)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: self-hosted
    # The runner must be labelled so only a machine that can reach the phone's
    # CDP endpoint (localhost:9222 via the adb/forwarder) picks this up.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip websockets
      - name: Confirm CDP endpoint reachable
        run: |
          python - <<'PY'
          import urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:9222/json/version", timeout=5) as r:
                  print("cdp:", r.status)
          except Exception as e:
              print("cdp unreachable:", e)
              raise SystemExit(1)
          PY
      - name: Run live high-level E2E
        run: python /data/data/com.termux/files/usr/tmp/hermes-verify-hl.py
